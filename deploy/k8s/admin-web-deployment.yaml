apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-order-admin-web
  namespace: family-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: family-order-admin-web
  template:
    metadata:
      labels:
        app: family-order-admin-web
    spec:
      containers:
        - name: admin-web
          image: your-registry.example.com/family-order-admin-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: family-order-admin-web
  namespace: family-order
spec:
  selector:
    app: family-order-admin-web
  ports:
    - name: http
      port: 80
      targetPort: 80
