apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-order-backend
  namespace: family-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: family-order-backend
  template:
    metadata:
      labels:
        app: family-order-backend
    spec:
      containers:
        - name: backend
          image: your-registry.example.com/family-order-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SERVER_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: family-order-config
                  key: SERVER_ADDRESS
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: family-order-secret
                  key: DATABASE_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-order-secret
                  key: JWT_SECRET
            - name: WECHAT_MOCK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: family-order-config
                  key: WECHAT_MOCK_ENABLED
            - name: WECHAT_APP_ID
              valueFrom:
                configMapKeyRef:
                  name: family-order-config
                  key: WECHAT_APP_ID
            - name: WECHAT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-order-secret
                  key: WECHAT_APP_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: family-order-backend
  namespace: family-order
spec:
  selector:
    app: family-order-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
